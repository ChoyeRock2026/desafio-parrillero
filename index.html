<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desafío Parrillero Entre Amigos | Choye Rock</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #0b0b0b;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    /* CONTENEDOR GENERAL */
    .pagina {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: #0b0b0b;
      overflow: hidden;
    }

    /* IMAGEN OFICIAL */
    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /* SOMBRA INFERIOR */
    .sombra {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      height: 40%;

      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.12) 18%,
        rgba(0, 0, 0, 0.50) 55%,
        rgba(0, 0, 0, 0.88) 100%
      );

      pointer-events: none;
      z-index: 1;
    }

    /* BLOQUE DE ACCIONES */
    .acciones {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 45px;

      padding: 0 20px;

      z-index: 2;
    }

    /* BOTONES */
    .botones {
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 11px;
    }

    .boton {
      width: 100%;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 14px 18px;

      border-radius: 6px;

      text-decoration: none;
      text-transform: uppercase;
      text-align: center;

      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;

      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .boton:active {
      transform: scale(0.98);
    }

    /* INSCRIPCIÓN */
    .inscripcion {
      background: #bd2d21;
      color: #ffffff;
    }

    /* CONVOCATORIA */
    .convocatoria {
      background: #efe2c5;
      color: #151515;
    }

    /* WHATSAPP */
    .whatsapp {
      background: #176f45;
      color: #ffffff;
    }

    /* INFORMACIÓN INFERIOR */
    .info-final {
      margin-top: 24px;

      text-align: center;
      text-transform: uppercase;

      color: rgba(255, 255, 255, 0.85);
    }

    .info-final strong {
      display: block;

      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      line-height: 1.5;
    }

    .info-final span {
      display: block;

      margin-top: 7px;

      font-size: 10px;
      font-weight: 400;
      letter-spacing: 1.4px;
      line-height: 1.5;

      color: rgba(255, 255, 255, 0.62);
    }

    /* COMPUTADORA */
    @media (min-width: 768px) {

      body {
        padding: 25px;
      }

      .pagina {
        max-width: 700px;
      }

      .acciones {
        width: 86%;

        left: 50%;
        right: auto;

        transform: translateX(-50%);

        bottom: 45px;

        padding: 0;
      }

      .boton {
        min-height: 60px;
      }

      .boton:hover {
        transform: translateY(-2px);
        opacity: 0.93;
      }

      .info-final strong {
        font-size: 13px;
      }

      .info-final span {
        font-size: 11px;
      }
    }

    /* CELULARES PEQUEÑOS */
    @media (max-width: 420px) {

      .acciones {
        bottom: 40px;
        padding: 0 18px;
      }

      .boton {
        min-height: 55px;
        font-size: 14px;
      }

      .botones {
        gap: 10px;
      }

      .info-final {
        margin-top: 20px;
      }

      .info-final strong {
        font-size: 11px;
        letter-spacing: 0.9px;
      }

      .info-final span {
        font-size: 9px;
        letter-spacing: 1px;
      }
    }

  </style>
</head>

<body>

  <main class="pagina">

    <!-- IMAGEN OFICIAL -->
    <img
      src="desafio-parrillero.jpg"
      alt="Desafío Parrillero Entre Amigos - Choye Rock 2026"
      class="poster"
    >

    <!-- SOMBRA PARA LEGIBILIDAD -->
    <div class="sombra"></div>

    <!-- ACCIONES -->
    <section class="acciones">

      <div class="botones">

        <a
          href="#"
          class="boton inscripcion"
        >
          Inscribir a mi equipo
        </a>

        <a
          href="#"
          class="boton convocatoria"
        >
          Consultar convocatoria
        </a>

        <a
          href="#"
          class="boton whatsapp"
        >
          Pedir informes
        </a>

      </div>

      <!-- INFORMACIÓN COMPLEMENTARIA -->
      <div class="info-final">

        <strong>
          Equipos de 3 a 5 integrantes · Inscripción gratuita
        </strong>

        <span>
          16 de octubre 2026 · Campestre La Pila
        </span>

      </div>

    </section>

  </main>

</body>
</html>
