<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desafío Parrillero Entre Amigos | Choye Rock</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: #f4ead8;
    }

    .hero {
      min-height: 100vh;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.20) 0%,
          rgba(0,0,0,.20) 45%,
          rgba(0,0,0,.72) 78%,
          rgba(0,0,0,.95) 100%
        ),
        url("desafio-parrillero.jpg");

      background-size: cover;
      background-position: center top;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 40px 20px;
    }

    .content {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .premio {
      margin-bottom: 22px;
    }

    .premio span {
      display: block;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .premio strong {
      display: block;
      margin-top: 4px;
      font-size: 38px;
      line-height: 1;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .boton {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 58px;

      padding: 15px 20px;

      text-decoration: none;
      text-transform: uppercase;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;

      border-radius: 6px;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    .boton:active {
      transform: scale(.98);
    }

    .inscripcion {
      background: #a9271c;
      color: white;
    }

    .convocatoria {
      background: #eee2ca;
      color: #111;
    }

    .whatsapp {
      background: #17643d;
      color: white;
    }

    .detalle {
      margin-top: 22px;

      font-size: 13px;
      line-height: 1.7;

      letter-spacing: .5px;

      color: rgba(255,255,255,.78);
    }

    @media (min-width: 800px) {

      .hero {
        background-position: center 25%;
      }

      .content {
        max-width: 560px;
      }

      .boton:hover {
        transform: translateY(-2px);
        opacity: .92;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <section class="content">

      <div class="premio">
        <span>Premio al primer lugar</span>
        <strong>$5,000 MXN</strong>
      </div>

      <div class="botones">

        <a class="boton inscripcion" href="#">
          Inscribir a mi equipo
        </a>

        <a class="boton convocatoria" href="#">
          Consultar convocatoria
        </a>

        <a class="boton whatsapp" href="#">
          Pedir informes
        </a>

      </div>

      <div class="detalle">
        Inscripción gratuita · Equipos de 3 a 5 integrantes<br>
        16 de octubre 2026 · Campestre La Pila
      </div>

    </section>

  </main>

</body>
</html>
