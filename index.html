<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desafío Parrillero Entre Amigos | Choye Rock</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: #0b0b0b;
      font-family: Arial, Helvetica, sans-serif;
    }

    .pagina {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      overflow: hidden;
      background: #0b0b0b;
    }

    /* PÓSTER COMPLETO */
    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /* OSCURECIDO ÚNICAMENTE EN LA PARTE INFERIOR */
    .sombra {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      pointer-events: none;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,.25) 25%,
        rgba(0,0,0,.72) 65%,
        rgba(0,0,0,.92) 100%
      );
    }

    /* BOTONES SOBRE EL PÓSTER */
    .acciones {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;

      padding: 0 20px;

      z-index: 2;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .boton {
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 14px 18px;

      border-radius: 6px;

      text-decoration: none;
      text-transform: uppercase;
      text-align: center;

      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;

      box-shadow: 0 4px 15px rgba(0,0,0,.25);

      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    .boton:active {
      transform: scale(.98);
    }

    .inscripcion {
      background: #b82c21;
      color: white;
    }

    .convocatoria {
      background: #eee2c8;
      color: #151515;
    }

    .whatsapp {
      background: #176b42;
      color: white;
    }

    /* COMPUTADORA */
    @media (min-width: 768px) {

      body {
        padding: 25px;
      }

      .pagina {
        min-height: auto;
      }

      .acciones {
        left: 50%;
        right: auto;
        transform: translateX(-50%);

        width: 86%;
        bottom: 28px;

        padding: 0;
      }

      .boton:hover {
        transform: translateY(-2px);
        opacity: .93;
      }
    }
  </style>
</head>

<body>

  <main class="pagina">

    <img
      src="desafio-parrillero.jpg"
      alt="Desafío Parrillero Entre Amigos - Choye Rock 2026"
      class="poster"
    >

    <div class="sombra"></div>

    <section class="acciones">

      <div class="botones">

        <a href="#" class="boton inscripcion">
          Inscribir a mi equipo
        </a>

        <a href="#" class="boton convocatoria">
          Consultar convocatoria
        </a>

        <a href="#" class="boton whatsapp">
          Pedir informes
        </a>

      </div>

    </section>

  </main>

</body>
</html>
