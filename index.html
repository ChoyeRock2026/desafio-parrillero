<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desafío Parrillero Entre Amigos | Choye Rock</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #0d0d0d;
    }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .pagina {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: #0d0d0d;
    }

    /* IMAGEN OFICIAL */
    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ÁREA DE BOTONES */
    .acciones {
      padding: 18px 18px 28px;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .boton {
      width: 100%;
      min-height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 15px 20px;

      border-radius: 5px;

      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .boton:active {
      transform: scale(0.98);
    }

    .inscripcion {
      background: #b52b20;
      color: #fff;
    }

    .convocatoria {
      background: #eee2c8;
      color: #151515;
    }

    .whatsapp {
      background: #176b42;
      color: #fff;
    }

    /* COMPUTADORA */
    @media (min-width: 768px) {

      body {
        padding: 35px 20px;
      }

      .pagina {
        border-radius: 4px;
        overflow: hidden;
      }

      .acciones {
        padding: 22px 28px 32px;
      }

      .boton:hover {
        transform: translateY(-2px);
        opacity: 0.92;
      }
    }
  </style>
</head>

<body>

  <main class="pagina">

    <img
      src="desafio-parrillero.jpg"
      alt="Desafío Parrillero Entre Amigos - Choye Rock 2026"
      class="poster"
    >

    <section class="acciones">

      <div class="botones">

        <a href="#" class="boton inscripcion">
          Inscribir a mi equipo
        </a>

        <a href="#" class="boton convocatoria">
          Consultar convocatoria
        </a>

        <a href="#" class="boton whatsapp">
          Pedir informes
        </a>

      </div>

    </section>

  </main>

</body>
</html>
